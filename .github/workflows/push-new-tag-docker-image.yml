name: C/C++ CI

on:
  push:
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Initialize variables
      env:
        IS_NEED_TO_PACKAGE: ${{ startsWith( github.ref, 'refs/tags/v' ) }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        cat <<EOF >> $GITHUB_ENV
        IS_NEED_TO_PACKAGE=$IS_NEED_TO_PACKAGE
        PACKAGE_VERSION=$(echo $GITHUB_REF | tr -d 'refs/tags/' )
        EOF

    - uses: actions/checkout@v3


    - name: Create Release
      if: ${{ fromJSON(env.IS_NEED_TO_PACKAGE) }}
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.PACKAGE_VERSION }}
        release_name: Release ${{ env.PACKAGE_VERSION }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: ${{ fromJSON(env.IS_NEED_TO_PACKAGE) }}
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: ${{ env.ARTIFACT_PATHNAME }}
        asset_name: ${{ env.ARTIFACT_NAME }}
        asset_content_type: application/zip

    - name: Log in to the Container registry
      if: ${{ fromJSON(env.IS_NEED_TO_PACKAGE) }}
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Build and push Docker images
      if: ${{ fromJSON(env.IS_NEED_TO_PACKAGE) }}
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: |
          ghcr.io/montimage/networkfuzzer:${{ env.PACKAGE_VERSION }}
          ghcr.io/montimage/networkfuzzer:latest
