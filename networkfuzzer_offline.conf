# Offline-only config: forward enabled for rule processing + pcap dump, no DICOM server target
dpdk-option = "--syslog=syslog --log-level=5 -c 0x55555555555"
stack-type = 1

input {
	mode = OFFLINE
	source = "./pcap/capture_echo.pcap"
	snap-len = 65535
}

output {
	enable = true
	output-dir = "./"
	sample-interval = 5
	report-description = true
}

engine {
	thread-nb     = 0
	exclude-rules = ""
	rules-mask    = ""
	ip-encapsulation-index = LAST
	max-instances = 100000
}

mempool {
	max-bytes = 2000000000
	max-elements = 1000
	max-message-size = 3000
	smp-ring-size = 1000
}

dump-packet
{
	enable      = true
	output-file = "./pcap/dump.pcap"
}

forward
{
	enable     = true
	output-nic = "lo"
	nb-copies  = 1
	snap-len   = 0
	promisc    = 1
	default    = DROP
	# No target-protocols: no DICOM/TCP/SCTP connection attempted
}
